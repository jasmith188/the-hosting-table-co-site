      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",

        "telephone": "+1-608-477-0652",
        "email": "jimmy@thehostingtableco.com",
        "founder": {
          "@type": "Person",
          "name": "Chef Jimmy Smith"
        },
        "description": "Private chef dinners, vacation rental dining, in-home meal prep, and custom dining experiences serving Baraboo, Wisconsin Dells, Madison, Waunakee, Sun Prairie, Lake Delton, and surrounding South Central Wisconsin areas.",
        "priceRange": "$$$",
        "areaServed": [
          "Baraboo WI",

          "Lake Delton WI",
          "Madison WI",

          "Waunakee WI",
          "Sun Prairie WI",

        ],

        "makesOffer": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Private Chef Dinner" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Vacation Rental Dining" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "In-Home Meal Prep" } }
        ]
      }

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What areas does The Hosting Table Co. serve in Wisconsin?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Chef Jimmy currently serves Baraboo, Wisconsin Dells, Lake Delton, Madison, Waunakee, Sun Prairie, Middleton, and nearby South Central Wisconsin communities."
            }
          },
          {
            "@type": "Question",
            "name": "Do you cook for Wisconsin Dells vacation rentals and Airbnbs?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Vacation rental and Airbnb dinners are available for family trips, celebrations, bachelor and bachelorette weekends, and groups who want a private dining experience without leaving the property."
            }
          },
          {
            "@type": "Question",
            "name": "Can menus be customized?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Menus are starting points and can be adjusted around guest preferences, allergies, dietary needs, budget, service style, and the occasion."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <form name="private-dining-inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="private-dining-inquiry" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="date" name="event-date" />
      <input type="number" name="guest-count" />
      <input type="text" name="location" />
      <input type="text" name="dining-style" />

    </form>
